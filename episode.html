<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节目详情 · 投研播客</title>
<link rel="stylesheet" href="styles.css">
<style>.detail{max-width:820px;margin:0 auto;padding:24px 28px 40px;}.back{color:var(--muted);font-size:13px;margin-bottom:14px;display:inline-block;}.detail h2{font-size:24px;line-height:1.35;margin:8px 0;}.detail .meta{color:var(--muted);font-size:13px;margin-bottom:18px;}.detail .body{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;font-size:14px;color:#d3d7df;white-space:pre-wrap;}.detail .body p{margin:10px 0;}.placeholder{color:var(--muted);font-style:italic;}</style>
</head>
<body>
<header class="site-header"><div class="brand"><div class="logo">投</div><div><h1>投研播客</h1><p class="sub">元宝投研 · 每日开车听点硬核的</p></div></div></header>
<section class="detail">
  <a class="back" href="index.html">← 返回节目单</a>
  <span class="cat-tag" id="dCat" style="font-size:11px;padding:3px 9px;border-radius:20px;color:#fff"></span>
  <h2 id="dTitle"></h2>
  <div class="meta" id="dMeta"></div>
  <div class="player-card">
    <div class="now-playing"><span class="dot"></span><span id="nowTitle">未播放</span></div>
    <div class="controls">
      <button id="btnPlay">▶</button>
      <select id="voiceSel"></select>
      <input type="range" id="rate" min="0.7" max="1.6" step="0.05" value="1" title="语速">
      <span style="font-size:12px;color:var(--muted)" id="dLen"></span>
    </div>
  </div>
  <div class="body" id="dBody"></div>
</section>
<script>
const $=(s)=>document.querySelector(s);
const params=new URLSearchParams(location.search);const id=params.get('id');
fetch('data/episodes.json').then(r=>r.json()).then(data=>{
  const e=data.episodes.find(x=>x.id===id);if(!e)return;const c=data.categories.find(x=>x.id===e.cat);
  $('#dCat').textContent=c.name;$('#dCat').style.background=c.color;
  $('#dTitle').textContent=e.title;$('#dMeta').textContent=e.schedule+' · '+e.tags.map(t=>'#'+t).join(' ');
  const body=e.body||'';
  if(body){
    $('#dBody').innerHTML='<p style="white-space:pre-wrap;margin:0;">'+body.replace(/</g,'&lt;')+'</p>';
  }else{
    $('#dBody').innerHTML='<p class="placeholder">📻 本期正文待回填：对应定时任务（'+e.task_title+'）产出后，将由元宝自动填充真实正文。</p><p>'+e.summary+'</p>';
  }
  populateVoices();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=populateVoices;
  window.__ep=e;
  const play=()=>{stop();const text=body?($('#dTitle').textContent+'。'+body):($('#dTitle').textContent+'。'+e.summary);utter=new SpeechSynthesisUtterance(text);const v=$('#voiceSel').value;if(v){const vv=speechSynthesis.getVoices().find(x=>x.voiceURI===v);if(vv)utter.voice=vv;}utter.rate=parseFloat($('#rate').value)||1;utter.lang='zh-CN';$('#nowTitle').textContent='正在播放：'+e.title;speechSynthesis.speak(utter);};
  $('#btnPlay').onclick=play;$('#rate').oninput=()=>{if(utter)play();};
}).catch(err=>$('#dBody').textContent='加载失败：'+err.message);
function populateVoices(){const sel=$('#voiceSel');const vs=speechSynthesis.getVoices().filter(v=>/zh|Chinese|cmn/i.test(v.lang+''+v.name));sel.innerHTML='';if(!vs.length){sel.add(new Option('默认',''));return;}vs.forEach((v,i)=>sel.add(new Option(v.name||('发音人'+(i+1)),v.voiceURI)));}
function stop(){'speechSynthesis' in window&&speechSynthesis.cancel();}
window.addEventListener('beforeunload',stop);
</script>
</body>
</html>
